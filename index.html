<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ร้านค้า POS</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase SDK (compat version) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- ============ Login Screen ============ -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">🏪</div>
      <h1>ร้านค้า POS</h1>
      <p class="login-subtitle" id="loginSubtitle">เข้าสู่ระบบเพื่อใช้งาน</p>

      <label>อีเมล</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">

      <label>รหัสผ่าน</label>
      <input type="password" id="loginPassword" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="current-password">

      <button class="btn btn-primary" id="loginBtn" onclick="Auth.handleSubmit()">🔓 เข้าสู่ระบบ</button>

      <div class="login-links">
        <a href="#" id="toggleMode" onclick="Auth.toggleMode();return false;">ยังไม่มีบัญชี? สมัครใหม่</a>
        <a href="#" onclick="Auth.forgotPassword();return false;">ลืมรหัสผ่าน?</a>
      </div>

      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- ============ App Container ============ -->
  <div id="appContainer" style="display:none">

    <!-- PIN Screen -->
    <div class="pin-screen" id="pinScreen">
      <h1>🔒 ร้านค้า POS</h1>
      <p id="pinHint">ใส่รหัส PIN 4 หลัก</p>
      <div class="pin-dots" id="pinDots">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>
      <div class="pin-pad" id="pinPad"></div>
      <button class="btn pin-forgot-btn" onclick="PIN.forgot()">ลืมรหัส?</button>
    </div>

    <header>
      <span id="headerTitle">🏪 ขายสินค้า</span>
      <button class="btn-add" id="headerAddBtn" style="display:none">+</button>
    </header>

    <main>
      <div id="screen-pos" class="screen active">
        <div class="cats" id="catsBar"></div>
        <div id="productsArea"></div>
      </div>

      <div id="screen-products" class="screen">
        <div id="productsListArea"></div>
      </div>

      <div id="screen-history" class="screen">
        <div class="tab-switch">
          <button class="active" data-h="day" onclick="HIST.setView('day')">วัน</button>
          <button data-h="week" onclick="HIST.setView('week')">7 วัน</button>
          <button data-h="month" onclick="HIST.setView('month')">30 วัน</button>
        </div>
        <div id="historyContent"></div>
      </div>

      <div id="screen-settings" class="screen">
        <div id="settingsContent"></div>
      </div>
    </main>

    <div class="cart-bar" id="cartBar">
      <div class="info">
        <div class="count" id="cartCount">0 ชิ้น</div>
        <div class="total" id="cartTotal">฿0</div>
      </div>
      <button class="btn-clear" onclick="Cart.clear()">🗑️</button>
      <button class="btn-pay" onclick="openCheckout()">จ่ายเงิน</button>
    </div>

    <button class="fab" id="fab" style="display:none" onclick="openProductForm()">+</button>

    <nav>
      <button class="active" data-screen="pos" onclick="switchTab('pos')">
        <span class="icon">🛒</span><span>ขาย</span>
      </button>
      <button data-screen="products" onclick="switchTab('products')">
        <span class="icon">📦</span><span>สินค้า</span>
      </button>
      <button data-screen="history" onclick="switchTab('history')">
        <span class="icon">🧾</span><span>ประวัติ</span>
      </button>
      <button data-screen="settings" onclick="switchTab('settings')">
        <span class="icon">⚙️</span><span>ตั้งค่า</span>
      </button>
    </nav>

    <div class="modal" id="modal">
      <div class="modal-content" id="modalContent"></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <!-- ============ Scripts ============ -->
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/db.js"></script>
  <script src="js/promptpay.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/pin.js"></script>
  <script src="js/pos.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/products.js"></script>
  <script src="js/history.js"></script>
  <script src="js/settings-page.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
